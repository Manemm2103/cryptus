services:
  cryptus:
    build: .
    image: cryptus:latest
    container_name: cryptus
    environment:
      USER_A_PASSWORD: "${USER_A_PASSWORD}"
      USER_B_PASSWORD: "${USER_B_PASSWORD}"
      USER_A_LABEL: "${USER_A_LABEL:-User A}"
      USER_B_LABEL: "${USER_B_LABEL:-User B}"
      PORT: "3000"
      DATA_DIR: /app/data
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-32}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-12}"
      MESSAGE_MAX_HOURS: "${MESSAGE_MAX_HOURS:-24}"
      READ_DELETE_MINUTES: "${READ_DELETE_MINUTES:-30}"
    ports:
      - "${CRYPTUS_PORT:-3000}:3000"
    volumes:
      - cryptus_data:/app/data
    restart: unless-stopped

volumes:
  cryptus_data:
